<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Project — REVOLVYN</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');
		*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
		html, body {
			width: 100%; height: 100vh; background: #000;
			overflow: hidden; font-family: 'Inter', system-ui, sans-serif;
			color: #e8ece4; scrollbar-width: none; -ms-overflow-style: none;
		}
		html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

		.page-transition {
			position: fixed; inset: 0; background: #000; z-index: 9999;
			pointer-events: none; opacity: 0; transition: opacity 0.2s ease;
		}
		.page-transition.active { opacity: 1; }

		/* Nav */
		.nav-float {
			position: fixed; top: 0; left: 0; right: 0;
			display: flex; justify-content: space-between; align-items: center;
			padding: 20px 40px; z-index: 100; pointer-events: none;
			background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
		}
		.nav-logo {
			font-family: 'Playfair Display', serif; font-size: 18px;
			color: rgba(245, 250, 230, 0.9); letter-spacing: 1px;
			pointer-events: auto; cursor: pointer;
		}
		.nav-links { display: flex; gap: 28px; pointer-events: auto; }
		.nav-links a {
			font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.6); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
		}
		.nav-links a:hover, .nav-links a.active { color: rgba(230, 245, 120, 0.95); }
		.nav-hamburger {
			display: none; flex-direction: column; gap: 5px;
			background: none; border: none; cursor: pointer;
			padding: 6px; pointer-events: auto; z-index: 200;
		}
		.nav-hamburger span {
			display: block; width: 22px; height: 2px;
			background: rgba(215, 230, 190, 0.8); border-radius: 2px;
			transition: all 0.3s ease;
		}
		.nav-hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
		.nav-hamburger.open span:nth-child(2) { opacity: 0; }
		.nav-hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
		.nav-mobile-overlay {
			display: none; position: fixed; inset: 0;
			background: rgba(8, 12, 5, 0.97); z-index: 99;
			flex-direction: column; align-items: center; justify-content: center;
			gap: 32px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
		}
		.nav-mobile-overlay.open { opacity: 1; pointer-events: auto; }
		.nav-mobile-overlay a {
			font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.7); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
		}
		.nav-mobile-overlay a:hover { color: rgba(230, 245, 120, 0.95); }
		@media (max-width: 768px) {
			.nav-float { padding: 14px 16px; }
			.nav-links { display: none; }
			.nav-hamburger { display: flex; }
			.nav-mobile-overlay { display: flex; }
		}

		/* Back button */
		.back-btn {
			position: fixed; top: 80px; left: 40px; z-index: 90;
			display: inline-flex; align-items: center; gap: 8px;
			font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.5); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
			pointer-events: auto; cursor: pointer;
		}
		.back-btn:hover { color: rgba(230, 245, 120, 0.95); }
		.back-btn svg {
			width: 16px; height: 16px; stroke: currentColor; fill: none;
			stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
		}
		@media (max-width: 768px) {
			.back-btn { top: 70px; left: 16px; }
		}

		/* Main Layout - Split Screen */
		.video-layout {
			display: flex;
			height: 100vh;
			width: 100%;
			overflow: hidden;
		}

		/* Left - Video Player */
		.video-panel {
			flex: 0 0 58%;
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #000;
			overflow: hidden;
			height: 100%;
		}
		.video-panel video {
			width: 100%;
			height: 100%;
			object-fit: contain;
			opacity: 0;
			transition: opacity 0.8s ease;
			contain: layout style paint;
		}
		.video-panel video.loaded { opacity: 1; }

		/* Portrait video in left panel */
		.video-panel.portrait-mode video {
			max-width: 340px;
			max-height: 80vh;
			border-radius: 16px;
			box-shadow: 0 20px 80px rgba(0,0,0,0.8);
		}

		/* Landscape video in left panel */
		.video-panel.landscape-mode video {
			width: 100%; height: 100%;
			max-width: 100%; max-height: 100%;
			border-radius: 0;
		}

		/* Fullscreen video */
		.video-panel:fullscreen video,
		.video-panel:-webkit-full-screen video {
			width: 100vw; height: 100vh;
			object-fit: contain;
		}

		/* Video controls */
		.video-controls {
			position: absolute; bottom: 0; left: 0; right: 0;
			padding: 16px 24px 20px; z-index: 10;
			display: flex; align-items: center; gap: 12px;
			background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
			opacity: 0; transition: opacity 0.3s;
		}
		.video-panel:hover .video-controls { opacity: 1; }
		.ctrl-btn {
			background: none; border: none; cursor: pointer; padding: 4px;
			display: flex; align-items: center; justify-content: center;
		}
		.ctrl-btn svg {
			width: 18px; height: 18px; stroke: rgba(230, 245, 120, 0.8); fill: none;
			stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
			transition: stroke 0.2s;
		}
		.ctrl-btn:hover svg { stroke: rgba(230, 245, 120, 1); }
		.progress-bar {
			flex: 1; height: 3px; background: rgba(255,255,255,0.15);
			border-radius: 2px; cursor: pointer; position: relative;
			overflow: hidden;
		}
		.progress-fill {
			height: 100%; background: rgba(230, 245, 120, 0.8);
			border-radius: 2px; width: 0%; transition: width 0.1s linear;
		}
		.time-display {
			font-size: 11px; color: rgba(215, 230, 190, 0.6);
			font-variant-numeric: tabular-nums; min-width: 80px; text-align: right;
		}

		/* Right - Info Panel */
		.info-panel {
			flex: 0 0 42%;
			padding: 100px 48px 40px 48px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			overflow-y: auto;
			height: 100%;
		}
		.brand-tag {
			display: inline-block; padding: 6px 16px;
			background: rgba(230, 245, 120, 0.08); border: 1px solid rgba(230, 245, 120, 0.2);
			border-radius: 24px; margin-bottom: 16px; width: fit-content;
			font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
			color: rgba(230, 245, 120, 0.9); font-weight: 500;
		}
		.brand-title {
			font-family: 'Playfair Display', serif;
			font-size: clamp(28px, 3vw, 42px);
			color: rgba(245, 250, 230, 0.95); font-weight: 400;
			line-height: 1.15; margin-bottom: 24px;
		}
		.info-divider {
			width: 48px; height: 1px;
			background: rgba(230, 245, 120, 0.3);
			margin: 0 0 24px;
		}
		.info-description {
			font-size: 15px; line-height: 1.8;
			color: rgba(215, 230, 190, 0.55);
			margin-bottom: 40px;
		}

		/* Details */
		.details-list {
			display: flex; flex-direction: column; gap: 20px;
			padding: 24px 0;
			border-top: 1px solid rgba(230, 245, 120, 0.08);
			border-bottom: 1px solid rgba(230, 245, 120, 0.08);
			margin-bottom: 40px;
		}
		.detail-row {
			display: flex; justify-content: space-between; align-items: center;
			opacity: 0; transform: translateY(12px);
			transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
		}
		.detail-row.revealed { opacity: 1; transform: translateY(0); }
		.detail-label {
			font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(230, 245, 120, 0.5);
		}
		.detail-value {
			font-family: 'Playfair Display', serif; font-size: 15px;
			color: rgba(245, 250, 230, 0.9);
		}

		/* Project Nav */
		.project-nav {
			display: flex; justify-content: space-between; align-items: center;
			padding-top: 24px;
		}
		.nav-link {
			display: flex; align-items: center; gap: 10px;
			font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.5); text-decoration: none;
			transition: color 0.3s; font-weight: 500; cursor: pointer;
		}
		.nav-link:hover { color: rgba(230, 245, 120, 0.95); }
		.nav-link svg {
			width: 16px; height: 16px; stroke: currentColor; fill: none;
			stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
		}
		.nav-link .nav-label {
			font-size: 9px; letter-spacing: 2px; color: rgba(215, 230, 190, 0.35);
			display: block;
		}
		.nav-link .nav-brand {
			font-family: 'Playfair Display', serif; font-size: 13px;
			color: rgba(245, 250, 230, 0.8); display: block;
		}
		.nav-link:hover .nav-brand { color: rgba(230, 245, 120, 0.95); }

		/* CTA */
		.project-cta {
			text-align: center; padding: 0;
		}
		.project-cta a {
			display: inline-block; padding: 14px 40px;
			border: 1px solid rgba(180, 220, 100, 0.25); border-radius: 40px;
			color: rgba(200, 230, 130, 0.8); font-size: 11px;
			letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
			transition: all 0.3s; font-weight: 500;
			background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
		}
		.project-cta a:hover {
			background: rgba(180, 220, 100, 0.1);
			border-color: rgba(180, 220, 100, 0.5);
			color: rgba(230, 245, 120, 0.95);
		}

		/* Responsive */
		@media (max-width: 1024px) {
			.video-panel { flex: 0 0 52%; }
			.info-panel { flex: 0 0 48%; padding: 100px 32px 40px; }
		}
		@media (max-width: 768px) {
			.video-layout { flex-direction: column; }
			.video-panel {
				flex: none; width: 100%; height: 45vh;
				position: relative;
			}
			.video-panel.portrait-mode { height: 50vh; min-height: 280px; }
			.video-panel.portrait-mode video {
				max-width: 200px; border-radius: 12px;
			}
			.video-panel.landscape-mode video { border-radius: 6px; }
			.info-panel {
				flex: 1; width: 100%; height: auto;
				padding: 24px 16px 16px;
				overflow-y: auto;
			}
			.brand-title { font-size: 22px; margin-bottom: 12px; }
			.info-description { font-size: 13px; margin-bottom: 16px; }
			.details-list { gap: 10px; padding: 12px 0; margin-bottom: 16px; }
			.detail-row { opacity: 1; transform: none; }
			.detail-value { font-size: 13px; }
			.project-nav { padding-top: 12px; }
			.nav-link .nav-brand { font-size: 12px; }
			.video-controls { padding: 10px 16px 14px; gap: 8px; }
			.ctrl-btn svg { width: 14px; height: 14px; }
			.time-display { font-size: 10px; min-width: 60px; }
			.back-btn { top: 70px; left: 16px; font-size: 10px; }
		}
		@media (max-width: 480px) {
			.video-panel { height: 40vh; min-height: 240px; }
			.video-panel.portrait-mode { height: 45vh; min-height: 260px; }
			.video-panel.portrait-mode video { max-width: 160px; }
			.info-panel { padding: 20px 14px 16px; }
			.brand-title { font-size: 18px; margin-bottom: 8px; }
			.info-description { font-size: 12px; margin-bottom: 12px; }
			.details-list { gap: 8px; padding: 10px 0; margin-bottom: 12px; }
			.project-nav { padding-top: 10px; }
		}
		@media (prefers-reduced-motion: reduce) {
			.detail-row { transition: opacity 0.2s; transform: none; }
			.page-transition { transition: none; }
		}
	</style>
</head>
<body>
	<div class="page-transition" id="pageTransition"></div>

	<nav class="nav-float">
		<div class="nav-logo" onclick="smoothNavigate('index.html')" style="cursor:pointer">REVOLVYN</div>
		<div class="nav-links">
			<a href="index.html" onclick="smoothNavigate(event, 'index.html')">About Us</a>
			<a href="portfolio.html" onclick="smoothNavigate(event, 'portfolio.html')">Portfolio</a>
			<a href="brands.html" onclick="smoothNavigate(event, 'brands.html')">Brands</a>
			<a href="services.html" onclick="smoothNavigate(event, 'services.html')">Services</a>
			<a href="contact.html" onclick="smoothNavigate(event, 'contact.html')">Contact Us</a>
		</div>
		<button class="nav-hamburger" id="navHamburger" aria-label="Menu"><span></span><span></span><span></span></button>
	</nav>
	<div class="nav-mobile-overlay" id="navMobileOverlay">
		<a href="index.html" onclick="smoothNavigate(event, 'index.html')">About Us</a>
		<a href="portfolio.html" onclick="smoothNavigate(event, 'portfolio.html')">Portfolio</a>
		<a href="brands.html" onclick="smoothNavigate(event, 'brands.html')">Brands</a>
		<a href="services.html" onclick="smoothNavigate(event, 'services.html')">Services</a>
		<a href="contact.html" onclick="smoothNavigate(event, 'contact.html')">Contact Us</a>
	</div>

	<a class="back-btn" onclick="smoothNavigate('portfolio.html')" style="cursor:pointer">
		<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
		Back to Portfolio
	</a>

	<div class="video-layout">
		<!-- Left: Video Player -->
		<div class="video-panel" id="videoPanel">
			<video id="mainVideo" loop playsinline preload="auto"></video>
			<div class="video-controls" id="videoControls">
				<button class="ctrl-btn" id="playPauseBtn" onclick="togglePlay()">
					<svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
					<svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><line x1="6" y1="4" x2="6" y2="20"/><line x1="18" y1="4" x2="18" y2="20"/></svg>
				</button>
				<button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">
					<svg id="unmuteIcon" viewBox="0 0 24 24" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
					<svg id="muteIcon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
				</button>
				<div class="progress-bar" id="progressBar" onclick="seekVideo(event)">
					<div class="progress-fill" id="progressFill"></div>
				</div>
				<div class="time-display" id="timeDisplay">0:00 / 0:00</div>
				<button class="ctrl-btn" id="fullscreenBtn" onclick="toggleFullscreen()">
					<svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
				</button>
			</div>
		</div>

		<!-- Right: Info Panel -->
		<div class="info-panel">
			<div class="brand-tag" id="brandTag"></div>
			<h1 class="brand-title" id="projectTitle"></h1>
			<div class="info-divider"></div>
			<div class="info-description" id="projectDesc"></div>
			<div class="details-list">
				<div class="detail-row">
					<span class="detail-label">Client</span>
					<span class="detail-value" id="detailClient"></span>
				</div>
				<div class="detail-row">
					<span class="detail-label">Category</span>
					<span class="detail-value" id="detailCategory"></span>
				</div>
				<div class="detail-row">
					<span class="detail-label">Services</span>
					<span class="detail-value" id="detailServices"></span>
				</div>
			</div>
			<div class="project-nav" id="projectNav">
				<a class="nav-link" id="prevLink">
					<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
					<div><span class="nav-label">Previous</span><span class="nav-brand" id="prevBrand"></span></div>
				</a>
				<a class="nav-link" id="nextLink" style="text-align:right;">
					<div><span class="nav-label">Next</span><span class="nav-brand" id="nextBrand"></span></div>
					<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
				</a>
			</div>
		</div>
	</div>

	<div class="project-cta">
		<a href="contact.html" onclick="smoothNavigate(event, 'contact.html')">Start a Project &rarr;</a>
	</div>

	<script>
		const transition = document.getElementById('pageTransition');
		function smoothNavigate(e, url) {
			if (e && e.preventDefault) e.preventDefault();
			if (!url && typeof e === 'string') url = e;
			transition.classList.add('active');
			setTimeout(() => { window.location.href = url; }, 200);
		}

		const navHamburger = document.getElementById('navHamburger');
		const navMobileOverlay = document.getElementById('navMobileOverlay');
		navHamburger.addEventListener('click', () => {
			navHamburger.classList.toggle('open');
			navMobileOverlay.classList.toggle('open');
		});
		navMobileOverlay.querySelectorAll('a').forEach(a => {
			a.addEventListener('click', () => {
				navHamburger.classList.remove('open');
				navMobileOverlay.classList.remove('open');
			});
		});

		const params = new URLSearchParams(window.location.search);
		const brand = params.get('brand') || 'NIKE';
		const title = params.get('title') || 'Nike';
		const desc = params.get('desc') || '';
		const videoUrl = params.get('video') || '';
		const orient = params.get('orient') || 'landscape';
		const currentIndex = parseInt(params.get('index') || '0', 10);

		const currentProject = {
			brand, title, desc, video: videoUrl, orient,
			category: params.get('category') || 'Brand Campaign',
			services: params.get('services') || 'Brand Film'
		};

		document.title = `${currentProject.title} — REVOLVYN`;

		document.getElementById('brandTag').textContent = currentProject.brand;
		document.getElementById('projectTitle').textContent = currentProject.title;
		document.getElementById('projectDesc').textContent = currentProject.desc;
		document.getElementById('detailClient').textContent = currentProject.brand;
		document.getElementById('detailCategory').textContent = currentProject.category;
		document.getElementById('detailServices').textContent = currentProject.services;

		const videoPanel = document.getElementById('videoPanel');
		if (currentProject.orient === 'portrait') {
			videoPanel.classList.add('portrait-mode');
		} else {
			videoPanel.classList.add('landscape-mode');
		}

		const mainVideo = document.getElementById('mainVideo');
		const progressFill = document.getElementById('progressFill');
		const timeDisplay = document.getElementById('timeDisplay');
		const playIcon = document.getElementById('playIcon');
		const pauseIcon = document.getElementById('pauseIcon');
		const unmuteIcon = document.getElementById('unmuteIcon');
		const muteIcon = document.getElementById('muteIcon');
		let isPlaying = false;
		let isMuted = false;

		mainVideo.src = currentProject.video;
		mainVideo.muted = false;

		mainVideo.addEventListener('canplay', () => {
			mainVideo.classList.add('loaded');
			mainVideo.play().catch(() => {});
			isPlaying = true;
			playIcon.style.display = 'none';
			pauseIcon.style.display = 'block';
		}, { once: true });

		mainVideo.addEventListener('timeupdate', () => {
			if (mainVideo.duration) {
				const pct = (mainVideo.currentTime / mainVideo.duration) * 100;
				progressFill.style.width = pct + '%';
				timeDisplay.textContent = formatTime(mainVideo.currentTime) + ' / ' + formatTime(mainVideo.duration);
			}
		});

		function formatTime(s) {
			const m = Math.floor(s / 60);
			const sec = Math.floor(s % 60);
			return m + ':' + (sec < 10 ? '0' : '') + sec;
		}

		function togglePlay() {
			if (isPlaying) {
				mainVideo.pause();
				playIcon.style.display = 'block';
				pauseIcon.style.display = 'none';
				isPlaying = false;
			} else {
				mainVideo.play().catch(() => {});
				playIcon.style.display = 'none';
				pauseIcon.style.display = 'block';
				isPlaying = true;
			}
		}

		function toggleMute() {
			isMuted = !isMuted;
			mainVideo.muted = isMuted;
			unmuteIcon.style.display = isMuted ? 'block' : 'none';
			muteIcon.style.display = isMuted ? 'none' : 'block';
		}

		function seekVideo(e) {
			const bar = document.getElementById('progressBar');
			const rect = bar.getBoundingClientRect();
			const pct = (e.clientX - rect.left) / rect.width;
			mainVideo.currentTime = pct * mainVideo.duration;
		}

		function toggleFullscreen() {
			const el = videoPanel;
			const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
			if (!isFullscreen) {
				if (el.requestFullscreen) el.requestFullscreen();
				else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
			} else {
				if (document.exitFullscreen) document.exitFullscreen();
				else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
			}
		}

		document.getElementById('prevLink').onclick = (e) => {
			e.preventDefault();
			smoothNavigate('portfolio.html');
		};
		document.getElementById('prevBrand').textContent = 'Portfolio';
		document.getElementById('nextLink').style.display = 'none';

		const revealObserver = new IntersectionObserver((entries) => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					entry.target.classList.add('revealed');
					revealObserver.unobserve(entry.target);
				}
			});
		}, { threshold: 0.1, rootMargin: '50px 0px' });

		document.querySelectorAll('.detail-row').forEach(item => revealObserver.observe(item));
	</script>
</body>
</html>

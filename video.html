<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Project — REVOLVYN</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');
		*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
		html, body {
			width: 100%; min-height: 100vh; background: #000;
			overflow-x: hidden; font-family: 'Inter', system-ui, sans-serif;
			color: #e8ece4; scrollbar-width: none; -ms-overflow-style: none;
		}
		html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

		.page-transition {
			position: fixed; inset: 0; background: #000; z-index: 9999;
			pointer-events: none; opacity: 0; transition: opacity 0.2s ease;
		}
		.page-transition.active { opacity: 1; }

		/* Nav */
		.nav-float {
			position: fixed; top: 0; left: 0; right: 0;
			display: flex; justify-content: space-between; align-items: center;
			padding: 20px 40px; z-index: 100; pointer-events: none;
			background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
		}
		.nav-logo {
			font-family: 'Playfair Display', serif; font-size: 18px;
			color: rgba(245, 250, 230, 0.9); letter-spacing: 1px;
			pointer-events: auto; cursor: pointer;
		}
		.nav-links { display: flex; gap: 28px; pointer-events: auto; }
		.nav-links a {
			font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.6); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
		}
		.nav-links a:hover, .nav-links a.active { color: rgba(230, 245, 120, 0.95); }
		.nav-hamburger {
			display: none; flex-direction: column; gap: 5px;
			background: none; border: none; cursor: pointer;
			padding: 6px; pointer-events: auto; z-index: 200;
		}
		.nav-hamburger span {
			display: block; width: 22px; height: 2px;
			background: rgba(215, 230, 190, 0.8); border-radius: 2px;
			transition: all 0.3s ease;
		}
		.nav-hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
		.nav-hamburger.open span:nth-child(2) { opacity: 0; }
		.nav-hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
		.nav-mobile-overlay {
			display: none; position: fixed; inset: 0;
			background: rgba(8, 12, 5, 0.97); z-index: 99;
			flex-direction: column; align-items: center; justify-content: center;
			gap: 32px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
		}
		.nav-mobile-overlay.open { opacity: 1; pointer-events: auto; }
		.nav-mobile-overlay a {
			font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.7); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
		}
		.nav-mobile-overlay a:hover { color: rgba(230, 245, 120, 0.95); }
		@media (max-width: 768px) {
			.nav-float { padding: 14px 16px; }
			.nav-links { display: none; }
			.nav-hamburger { display: flex; }
			.nav-mobile-overlay { display: flex; }
		}

		/* Back button */
		.back-btn {
			position: fixed; top: 80px; left: 40px; z-index: 90;
			display: inline-flex; align-items: center; gap: 8px;
			font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.5); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
			pointer-events: auto; cursor: pointer;
		}
		.back-btn:hover { color: rgba(230, 245, 120, 0.95); }
		.back-btn svg {
			width: 16px; height: 16px; stroke: currentColor; fill: none;
			stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
		}
		@media (max-width: 768px) {
			.back-btn { top: 70px; left: 16px; }
		}

		/* Video Player Container */
		.video-player-section {
			position: relative; width: 100%; height: 100vh;
			display: flex; align-items: center; justify-content: center;
			background: #000; overflow: hidden;
		}
		.video-player-section video {
			max-width: 100%; max-height: 100vh;
			object-fit: contain; opacity: 0;
			transition: opacity 0.8s ease;
		}
		.video-player-section video.loaded { opacity: 1; }
		.video-player-section::after {
			content: ''; position: absolute; inset: 0;
			background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 12%, transparent 88%, rgba(0,0,0,0.95) 100%);
			pointer-events: none;
		}

		/* Portrait mode */
		.video-player-section.portrait-mode video {
			max-width: 380px; border-radius: 16px;
			box-shadow: 0 20px 60px rgba(0,0,0,0.8);
		}

		/* Landscape mode */
		.video-player-section.landscape-mode video {
			max-width: 1200px; border-radius: 12px;
			box-shadow: 0 20px 60px rgba(0,0,0,0.6);
		}

		/* Play overlay */
		.play-overlay {
			position: absolute; inset: 0; display: flex;
			align-items: center; justify-content: center; z-index: 5;
			cursor: pointer; transition: opacity 0.3s;
		}
		.play-overlay.hidden { opacity: 0; pointer-events: none; }
		.play-btn {
			width: 80px; height: 80px; border-radius: 50%;
			background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(230, 245, 120, 0.5);
			display: flex; align-items: center; justify-content: center;
			transition: all 0.3s; backdrop-filter: blur(12px);
		}
		.play-btn svg {
			width: 28px; height: 28px; fill: rgba(230, 245, 120, 0.9);
			margin-left: 4px;
		}
		.play-overlay:hover .play-btn {
			background: rgba(230, 245, 120, 0.12);
			border-color: rgba(230, 245, 120, 0.9);
			transform: scale(1.1);
		}

		/* Video controls bar */
		.video-controls {
			position: absolute; bottom: 0; left: 0; right: 0;
			padding: 16px 40px 24px; z-index: 10;
			display: flex; align-items: center; gap: 16px;
			background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
			opacity: 0; transition: opacity 0.3s;
		}
		.video-player-section:hover .video-controls { opacity: 1; }
		.ctrl-btn {
			background: none; border: none; cursor: pointer; padding: 4px;
			display: flex; align-items: center; justify-content: center;
		}
		.ctrl-btn svg {
			width: 20px; height: 20px; stroke: rgba(230, 245, 120, 0.8); fill: none;
			stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
			transition: stroke 0.2s;
		}
		.ctrl-btn:hover svg { stroke: rgba(230, 245, 120, 1); }
		.progress-bar {
			flex: 1; height: 3px; background: rgba(255,255,255,0.15);
			border-radius: 2px; cursor: pointer; position: relative;
			overflow: hidden;
		}
		.progress-fill {
			height: 100%; background: rgba(230, 245, 120, 0.8);
			border-radius: 2px; width: 0%; transition: width 0.1s linear;
		}
		.time-display {
			font-size: 11px; color: rgba(215, 230, 190, 0.6);
			font-variant-numeric: tabular-nums; min-width: 80px; text-align: right;
		}

		/* Brand overlay */
		.brand-overlay {
			position: absolute; top: 0; left: 0; right: 0;
			padding: 100px 40px 40px; z-index: 10;
			background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
		}
		.brand-tag {
			display: inline-block; padding: 6px 16px;
			background: rgba(230, 245, 120, 0.08); border: 1px solid rgba(230, 245, 120, 0.2);
			border-radius: 24px; margin-bottom: 12px;
			font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
			color: rgba(230, 245, 120, 0.9); font-weight: 500;
		}
		.brand-title {
			font-family: 'Playfair Display', serif;
			font-size: clamp(28px, 4vw, 48px);
			color: rgba(245, 250, 230, 0.95); font-weight: 400;
			line-height: 1.15;
		}

		/* Info section */
		.info-section {
			max-width: 900px; margin: 0 auto; padding: 60px 40px 40px;
		}
		.info-divider {
			width: 48px; height: 1px;
			background: rgba(230, 245, 120, 0.3);
			margin: 0 0 32px;
		}
		.info-description {
			font-size: 17px; line-height: 1.9;
			color: rgba(215, 230, 190, 0.6);
			max-width: 640px; margin-bottom: 48px;
		}

		/* Details grid */
		.details-grid {
			display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px;
			padding: 40px 0;
			border-top: 1px solid rgba(230, 245, 120, 0.08);
			border-bottom: 1px solid rgba(230, 245, 120, 0.08);
		}
		.detail-item {
			opacity: 0; transform: translateY(20px);
			transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
		}
		.detail-item.revealed { opacity: 1; transform: translateY(0); }
		.detail-item .label {
			font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(230, 245, 120, 0.5); margin-bottom: 10px;
		}
		.detail-item .value {
			font-family: 'Playfair Display', serif; font-size: 18px;
			color: rgba(245, 250, 230, 0.9);
		}

		/* Project nav */
		.project-nav {
			max-width: 900px; margin: 48px auto 0; padding: 0 40px 80px;
			display: flex; justify-content: space-between; align-items: center;
		}
		.nav-link {
			display: flex; align-items: center; gap: 10px;
			font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.5); text-decoration: none;
			transition: color 0.3s; font-weight: 500; cursor: pointer;
		}
		.nav-link:hover { color: rgba(230, 245, 120, 0.95); }
		.nav-link svg {
			width: 18px; height: 18px; stroke: currentColor; fill: none;
			stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
		}
		.nav-link .nav-label {
			font-size: 9px; letter-spacing: 2px; color: rgba(215, 230, 190, 0.35);
			display: block;
		}
		.nav-link .nav-brand {
			font-family: 'Playfair Display', serif; font-size: 14px;
			color: rgba(245, 250, 230, 0.8); display: block;
		}
		.nav-link:hover .nav-brand { color: rgba(230, 245, 120, 0.95); }

		/* CTA */
		.project-cta {
			text-align: center; padding: 20px 20px 100px;
		}
		.project-cta a {
			display: inline-block; padding: 14px 40px;
			border: 1px solid rgba(180, 220, 100, 0.25); border-radius: 40px;
			color: rgba(200, 230, 130, 0.8); font-size: 11px;
			letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
			transition: all 0.3s; font-weight: 500;
			background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
		}
		.project-cta a:hover {
			background: rgba(180, 220, 100, 0.1);
			border-color: rgba(180, 220, 100, 0.5);
			color: rgba(230, 245, 120, 0.95);
		}

		@media (max-width: 768px) {
			.video-player-section { height: 55vh; min-height: 280px; }
			.video-player-section.portrait-mode { height: 70vh; min-height: 360px; }
			.video-player-section.portrait-mode video { max-width: 220px; border-radius: 10px; }
			.video-player-section.landscape-mode video { border-radius: 6px; }
			.brand-overlay { padding: 80px 16px 16px; }
			.brand-tag { font-size: 9px; padding: 5px 12px; margin-bottom: 8px; }
			.brand-title { font-size: 20px; }
			.brand-desc { font-size: 12px; margin-top: 6px; }
			.video-controls { padding: 10px 16px 14px; gap: 10px; }
			.ctrl-btn svg { width: 16px; height: 16px; }
			.time-display { font-size: 10px; min-width: 60px; }
			.info-section { padding: 32px 16px 16px; }
			.info-header h2 { font-size: 20px; }
			.details-grid { grid-template-columns: 1fr; gap: 20px; }
			.detail-item h4 { font-size: 9px; }
			.detail-item p { font-size: 12px; }
			.back-btn { top: 70px; left: 16px; font-size: 10px; }
			.project-nav { padding: 0 16px 48px; flex-direction: column; gap: 16px; }
			.project-nav a { padding: 12px 24px; font-size: 10px; }
		}
		@media (max-width: 480px) {
			.video-player-section { height: 50vh; min-height: 240px; }
			.video-player-section.portrait-mode { height: 65vh; min-height: 320px; }
			.video-player-section.portrait-mode video { max-width: 180px; }
			.brand-overlay { padding: 72px 12px 12px; }
			.brand-title { font-size: 18px; }
			.info-header h2 { font-size: 18px; }
		}
	</style>
</head>
<body>

	<nav class="nav-float">

	</div>

	<script>
		const transition = document.getElementById('pageTransition');
		function smoothNavigate(e, url) {
			if (e && e.preventDefault) e.preventDefault();
			if (!url && typeof e === 'string') url = e;
			transition.classList.add('active');
			setTimeout(() => { window.location.href = url; }, 200);
		}

		const navHamburger = document.getElementById('navHamburger');
		const navMobileOverlay = document.getElementById('navMobileOverlay');
		navHamburger.addEventListener('click', () => {
			navHamburger.classList.toggle('open');
			navMobileOverlay.classList.toggle('open');
		});
		navMobileOverlay.querySelectorAll('a').forEach(a => {
			a.addEventListener('click', () => {
				navHamburger.classList.remove('open');
				navMobileOverlay.classList.remove('open');
			});

			{ brand: "HOICHOI", title: "Hoichoi", desc: "A leading Bengali-language streaming entertainment platform known for original series, films, and digital entertainment.", video: "https://video.wixstatic.com/video/4c7a69_04fe62bfdee4460da9398f023d851bfa/720p/mp4/file.mp4", orient: "landscape", category: "Entertainment", services: "Campaign Film" },

			{ brand: "BYTBOTS", title: "BytBots", desc: "A technology and digital-focused brand highlighting modern tech communication and visually engaging content.", video: "https://video.wixstatic.com/video/4c7a69_2a2f300c4ea4418291a3633bf79a8ccd/720p/mp4/file.mp4", orient: "landscape", category: "Technology", services: "Content Creation" },
			{ brand: "INDULEKHA", title: "Indulekha", desc: "A beauty and haircare brand known for traditional Indian-inspired wellness and personal-care products.", video: "https://video.wixstatic.com/video/4c7a69_729787cbdd9d43b5874bcfa720b60ef6/1080p/mp4/file.mp4", orient: "landscape", category: "Haircare", services: "Brand Story" },
			{ brand: "ARMANI", title: "Giorgio Armani", desc: "A globally recognized luxury fashion and lifestyle house known for refined design, understated elegance, and premium craftsmanship.", video: "https://video.wixstatic.com/video/4c7a69_920b8839a3fa4fa6bf1917ca8a44b414/720p/mp4/file.mp4", orient: "landscape", category: "Luxury Fashion", services: "Premium Film" },
			{ brand: "ARMANI", title: "Giorgio Armani", desc: "A globally recognized luxury fashion and lifestyle house known for refined design, understated elegance, and premium craftsmanship.", video: "https://video.wixstatic.com/video/4c7a69_a66586e5154d4a4ba6f5ce1e11b80694/720p/mp4/file.mp4", orient: "landscape", category: "Luxury Fashion", services: "Premium Film" }
		];

		const params = new URLSearchParams(window.location.search);
		const brand = params.get('brand') || 'NIKE';
		const title = params.get('title') || 'Nike';
		const desc = params.get('desc') || '';
		const videoUrl = params.get('video') || '';
		const orient = params.get('orient') || 'landscape';
		const currentIndex = parseInt(params.get('index') || '0', 10);

		const currentProject = allProjects[currentIndex] || {
			brand, title, desc, video: videoUrl, orient, category: "Brand Campaign", services: "Brand Film"
		};

		document.title = `${currentProject.title} — REVOLVYN`;

		document.getElementById('brandTag').textContent = currentProject.brand;
		document.getElementById('projectTitle').textContent = currentProject.title;
		document.getElementById('projectDesc').textContent = currentProject.desc;
		document.getElementById('detailClient').textContent = currentProject.brand;
		document.getElementById('detailCategory').textContent = currentProject.category;
		document.getElementById('detailServices').textContent = currentProject.services;

		const videoHero = document.getElementById('videoHero');
		if (currentProject.orient === 'portrait') {
			videoHero.classList.add('portrait-mode');
		} else {
			videoHero.classList.add('landscape-mode');
		}

		const mainVideo = document.getElementById('mainVideo');
		const playOverlay = document.getElementById('playOverlay');
		const progressFill = document.getElementById('progressFill');
		const timeDisplay = document.getElementById('timeDisplay');
		const playIcon = document.getElementById('playIcon');
		const pauseIcon = document.getElementById('pauseIcon');
		const unmuteIcon = document.getElementById('unmuteIcon');
		const muteIcon = document.getElementById('muteIcon');
		let isPlaying = false;
		let isMuted = true;

		mainVideo.src = currentProject.video;
		mainVideo.muted = true;

		mainVideo.addEventListener('canplay', () => {
			mainVideo.classList.add('loaded');
			mainVideo.play().catch(() => {});
			isPlaying = true;
			playIcon.style.display = 'none';
		pauseIcon.style.display = 'block';
		}, { once: true });

		mainVideo.addEventListener('timeupdate', () => {
			if (mainVideo.duration) {
				const pct = (mainVideo.currentTime / mainVideo.duration) * 100;
				progressFill.style.width = pct + '%';
				timeDisplay.textContent = formatTime(mainVideo.currentTime) + ' / ' + formatTime(mainVideo.duration);
			}
		})

		function formatTime(s) {
			const m = Math.floor(s / 60);
			const sec = Math.floor(s % 60);
			return m + ':' + (sec < 10 ? '0' : '') + sec;
		}

		function togglePlay() {
			if (isPlaying) {
				mainVideo.pause();
				playOverlay.classList.remove('hidden');
				playIcon.style.display = 'block';
				pauseIcon.style.display = 'none';
				isPlaying = false;
			} else {
				mainVideo.muted = isMuted;
				mainVideo.play().catch(() => {});
				playOverlay.classList.add('hidden');
				playIcon.style.display = 'none';
				pauseIcon.style.display = 'block';
				isPlaying = true;
			}
		}

		function toggleMute() {
			isMuted = !isMuted;
			mainVideo.muted = isMuted;
			unmuteIcon.style.display = isMuted ? 'block' : 'none';
			muteIcon.style.display = isMuted ? 'none' : 'block';
		}

		function seekVideo(e) {
			const bar = document.getElementById('progressBar');
			const rect = bar.getBoundingClientRect();
			const pct = (e.clientX - rect.left) / rect.width;
			mainVideo.currentTime = pct * mainVideo.duration;
		}

		function toggleFullscreen() {
			const el = videoHero;
			if (!document.fullscreenElement) {
				el.requestFullscreen().catch(() => {});
			} else {
				document.exitFullscreen();
			}
		}

		mainVideo.addEventListener('ended', () => {
			playIcon.style.display = 'block';
			pauseIcon.style.display = 'none';
			playOverlay.classList.remove('hidden');
			isPlaying = false;
		});

		const prevIndex = (currentIndex - 1 + allProjects.length) % allProjects.length;
		const nextIndex = (currentIndex + 1) % allProjects.length;
		const prevProject = allProjects[prevIndex];
		const nextProject = allProjects[nextIndex];

		document.getElementById('prevBrand').textContent = prevProject.brand;
		document.getElementById('nextBrand').textContent = nextProject.brand;

		const prevParams = new URLSearchParams({
			brand: prevProject.brand, title: prevProject.title,
			desc: prevProject.desc, video: prevProject.video,
			orient: prevProject.orient, index: String(prevIndex)
		}).toString();
		const nextParams = new URLSearchParams({
			brand: nextProject.brand, title: nextProject.title,
			desc: nextProject.desc, video: nextProject.video,
			orient: nextProject.orient, index: String(nextIndex)
		}).toString();

		document.getElementById('prevLink').onclick = (e) => {
			e.preventDefault();
			smoothNavigate('video.html?' + prevParams);
		};
		document.getElementById('nextLink').onclick = (e) => {
			e.preventDefault();
			smoothNavigate('video.html?' + nextParams);
		};

		const revealObserver = new IntersectionObserver((entries) => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					entry.target.classList.add('revealed');
					revealObserver.unobserve(entry.target);
				}
			});
		}, { threshold: 0.1, rootMargin: '50px 0px' });

		document.querySelectorAll('.detail-item').forEach(item => revealObserver.observe(item));
	</script>

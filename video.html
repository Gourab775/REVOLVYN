<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Project — REVOLVYN</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');
		*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
		html, body {
			width: 100%; min-height: 100vh; background: #000;
			overflow-x: hidden; font-family: 'Inter', system-ui, sans-serif;
			color: #e8ece4; scrollbar-width: none; -ms-overflow-style: none;
		}
		html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

		.page-transition {
			position: fixed; inset: 0; background: #000; z-index: 9999;
			pointer-events: none; opacity: 0; transition: opacity 0.4s ease;
		}
		.page-transition.active { opacity: 1; }

		.nav-float {
			position: fixed; top: 0; left: 0; right: 0;
			display: flex; justify-content: space-between; align-items: center;
			padding: 20px 40px; z-index: 100; pointer-events: none;
			background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
		}
		.nav-logo {
			font-family: 'Playfair Display', serif; font-size: 18px;
			color: rgba(245, 250, 230, 0.9); letter-spacing: 1px;
			pointer-events: auto; cursor: pointer;
		}
		.nav-links { display: flex; gap: 28px; pointer-events: auto; }
		.nav-links a {
			font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.6); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
		}
		.nav-links a:hover, .nav-links a.active { color: rgba(230, 245, 120, 0.95); }
		.nav-hamburger {
			display: none; flex-direction: column; gap: 5px;
			background: none; border: none; cursor: pointer;
			padding: 6px; pointer-events: auto; z-index: 200;
		}
		.nav-hamburger span {
			display: block; width: 22px; height: 2px;
			background: rgba(215, 230, 190, 0.8); border-radius: 2px;
			transition: all 0.3s ease;
		}
		.nav-hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
		.nav-hamburger.open span:nth-child(2) { opacity: 0; }
		.nav-hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
		.nav-mobile-overlay {
			display: none; position: fixed; inset: 0;
			background: rgba(8, 12, 5, 0.97); z-index: 99;
			flex-direction: column; align-items: center; justify-content: center;
			gap: 32px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
		}
		.nav-mobile-overlay.open { opacity: 1; pointer-events: auto; }
		.nav-mobile-overlay a {
			font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.7); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
		}
		.nav-mobile-overlay a:hover { color: rgba(230, 245, 120, 0.95); }
		@media (max-width: 768px) {
			.nav-float { padding: 16px 20px; }
			.nav-links { display: none; }
			.nav-hamburger { display: flex; }
			.nav-mobile-overlay { display: flex; }
		}

		.back-btn {
			position: fixed; top: 80px; left: 40px; z-index: 90;
			display: inline-flex; align-items: center; gap: 8px;
			font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.5); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
			pointer-events: auto; cursor: pointer;
		}
		.back-btn:hover { color: rgba(230, 245, 120, 0.95); }
		.back-btn svg {
			width: 16px; height: 16px; stroke: currentColor; fill: none;
			stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
		}
		@media (max-width: 768px) {
			.back-btn { top: 70px; left: 16px; }
		}

		/* Video hero - landscape mode */
		.video-hero {
			position: relative; width: 100%; height: 70vh; min-height: 400px;
			display: flex; align-items: center; justify-content: center;
			overflow: hidden; background: #000;
		}
		.video-hero video {
			width: 100%; height: 100%; object-fit: contain;
			opacity: 0; transition: opacity 0.8s ease;
			background: #000;
		}
		.video-hero video.loaded { opacity: 1; }
		.video-hero::after {
			content: ''; position: absolute; inset: 0;
			background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 15%, transparent 80%, rgba(0,0,0,0.9) 100%);
			pointer-events: none;
		}

		/* Portrait video hero - taller, narrower */
		.video-hero.portrait-mode {
			height: 85vh; min-height: 500px;
		}
		.video-hero.portrait-mode video {
			max-width: 420px;
			border-radius: 12px;
		}

		/* Landscape video - rounded corners */
		.video-hero.landscape-mode video {
			border-radius: 10px;
			max-width: 1100px;
		}

		.play-overlay {
			position: absolute; inset: 0; display: flex;
			align-items: center; justify-content: center; z-index: 5;
			cursor: pointer; transition: opacity 0.3s;
		}
		.play-overlay.hidden { opacity: 0; pointer-events: none; }
		.play-btn {
			width: 72px; height: 72px; border-radius: 50%;
			background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(230, 245, 120, 0.6);
			display: flex; align-items: center; justify-content: center;
			transition: all 0.3s; backdrop-filter: blur(10px);
		}
		.play-btn svg {
			width: 24px; height: 24px; fill: rgba(230, 245, 120, 0.9);
			margin-left: 3px;
		}
		.play-overlay:hover .play-btn {
			background: rgba(230, 245, 120, 0.15);
			border-color: rgba(230, 245, 120, 0.9);
			transform: scale(1.08);
		}

		.project-info {
			max-width: 900px; margin: -60px auto 0; padding: 0 40px;
			position: relative; z-index: 10;
		}
		.project-info .brand-tag {
			display: inline-block; padding: 6px 14px;
			background: rgba(230, 245, 120, 0.08); border: 1px solid rgba(230, 245, 120, 0.2);
			border-radius: 24px; margin-bottom: 20px;
			font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
			color: rgba(230, 245, 120, 0.9); font-weight: 500;
		}
		.project-info h1 {
			font-family: 'Playfair Display', serif;
			font-size: clamp(32px, 5vw, 56px);
			color: rgba(245, 250, 230, 0.95); font-weight: 400;
			line-height: 1.15; margin-bottom: 20px;
		}
		.project-info .divider {
			width: 48px; height: 1px;
			background: rgba(230, 245, 120, 0.3);
			margin: 24px 0;
		}
		.project-info .description {
			font-size: 16px; line-height: 1.8;
			color: rgba(215, 230, 190, 0.6);
			max-width: 600px;
		}

		.project-details {
			max-width: 900px; margin: 48px auto 0; padding: 0 40px;
			display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px;
		}
		.detail-item {
			opacity: 0; transform: translateY(20px);
			transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
		}
		.detail-item.revealed { opacity: 1; transform: translateY(0); }
		.detail-item .label {
			font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(230, 245, 120, 0.6); margin-bottom: 8px;
		}
		.detail-item .value {
			font-family: 'Playfair Display', serif; font-size: 18px;
			color: rgba(245, 250, 230, 0.9);
		}

		.project-nav {
			max-width: 900px; margin: 60px auto 0; padding: 32px 40px 80px;
			display: flex; justify-content: space-between; align-items: center;
			border-top: 1px solid rgba(230, 245, 120, 0.08);
		}
		.nav-link {
			display: flex; align-items: center; gap: 10px;
			font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.5); text-decoration: none;
			transition: color 0.3s; font-weight: 500; cursor: pointer;
		}
		.nav-link:hover { color: rgba(230, 245, 120, 0.95); }
		.nav-link svg {
			width: 18px; height: 18px; stroke: currentColor; fill: none;
			stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
		}
		.nav-link .nav-label {
			font-size: 9px; letter-spacing: 2px; color: rgba(215, 230, 190, 0.35);
			display: block;
		}
		.nav-link .nav-brand {
			font-family: 'Playfair Display', serif; font-size: 14px;
			color: rgba(245, 250, 230, 0.8); display: block;
		}
		.nav-link:hover .nav-brand { color: rgba(230, 245, 120, 0.95); }

		.project-cta {
			text-align: center; padding: 20px 20px 100px;
		}
		.project-cta a {
			display: inline-block; padding: 14px 40px;
			border: 1px solid rgba(180, 220, 100, 0.25); border-radius: 40px;
			color: rgba(200, 230, 130, 0.8); font-size: 11px;
			letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
			transition: all 0.3s; font-weight: 500;
			background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
		}
		.project-cta a:hover {
			background: rgba(180, 220, 100, 0.1);
			border-color: rgba(180, 220, 100, 0.5);
			color: rgba(230, 245, 120, 0.95);
		}

		@media (max-width: 768px) {
			.video-hero { height: 50vh; min-height: 280px; }
			.video-hero.portrait-mode { height: 65vh; min-height: 350px; }
			.video-hero.portrait-mode video { max-width: 280px; border-radius: 10px; }
			.video-hero.landscape-mode video { border-radius: 8px; }
			.project-info { margin-top: -30px; padding: 0 20px; }
			.project-details { grid-template-columns: 1fr; gap: 20px; padding: 0 20px; margin-top: 32px; }
			.project-nav { padding: 24px 20px 60px; margin-top: 40px; }
		}
	</style>
</head>

			{ brand: "HOICHOI", title: "Hoichoi", desc: "A leading Bengali-language streaming entertainment platform known for original series, films, and digital entertainment.", video: "https://video.wixstatic.com/video/4c7a69_bf4f28780ad642aeb01cb61516c362e3/1080p/mp4/file.mp4", orient: "landscape", category: "Entertainment", services: "Campaign Film" },
			{ brand: "SAT PROFESSOR", title: "SAT Professor", desc: "An education-focused brand associated with SAT preparation, turning educational messaging into engaging, accessible content.", video: "https://video.wixstatic.com/video/4c7a69_4aceff66cfd24ababafb1f6e47495261/1080p/mp4/file.mp4", orient: "landscape", category: "Education", services: "Content Creation" },
			{ brand: "TRADECFD", title: "TradeCFD", desc: "A financial trading-oriented brand demonstrating how performance-focused messaging translates into engaging digital content.", video: "https://video.wixstatic.com/video/4c7a69_2a2f300c4ea4418291a3633bf79a8ccd/720p/mp4/file.mp4", orient: "landscape", category: "Finance", services: "Ad Film" },
			{ brand: "PROJECT", title: "Client Campaign 1", desc: "Additional client campaign video showcasing creative direction and brand storytelling.", video: "https://video.wixstatic.com/video/4c7a69_0abcdc24eaed4b3e95a67da99aa1a2b0/1080p/mp4/file.mp4", orient: "portrait", category: "Brand Campaign", services: "Content Creation" },
			{ brand: "PROJECT", title: "Client Campaign 2", desc: "Additional client campaign video with dynamic visual approach and engaging content.", video: "https://video.wixstatic.com/video/4c7a69_c46cfd63cd96443badd9a27a0665fdff/1080p/mp4/file.mp4", orient: "portrait", category: "Brand Campaign", services: "Ad Film" },
			{ brand: "PROJECT", title: "Client Campaign 3", desc: "Additional client campaign video demonstrating creative content production.", video: "https://video.wixstatic.com/video/4c7a69_b378be38f16a4a48885fc3ef997da7c6/720p/mp4/file.mp4", orient: "landscape", category: "Brand Campaign", services: "Brand Film" },
			{ brand: "PROJECT", title: "Client Campaign 4", desc: "Additional client campaign video with compelling visual narrative.", video: "https://video.wixstatic.com/video/4c7a69_52ab300a0f5d4f3eb2e022531b7f5f26/720p/mp4/file.mp4", orient: "landscape", category: "Brand Campaign", services: "Content Creation" }
		];

		const params = new URLSearchParams(window.location.search);
		const brand = params.get('brand') || 'NIKE';
		const title = params.get('title') || 'Nike';
		const desc = params.get('desc') || '';
		const videoUrl = params.get('video') || '';
		const orient = params.get('orient') || 'landscape';
		const currentIndex = parseInt(params.get('index') || '0', 10);

		const currentProject = allProjects[currentIndex] || {
			brand, title, desc, video: videoUrl, orient, category: "Brand Campaign", services: "Brand Film"
		};

		document.title = `${currentProject.title} — REVOLVYN`;

		document.getElementById('brandTag').textContent = currentProject.brand;
		document.getElementById('projectTitle').textContent = currentProject.title;
		document.getElementById('projectDesc').textContent = currentProject.desc;
		document.getElementById('detailClient').textContent = currentProject.brand;
		document.getElementById('detailCategory').textContent = currentProject.category;
		document.getElementById('detailServices').textContent = currentProject.services;

		// Set video orientation mode
		const videoHero = document.getElementById('videoHero');
		if (currentProject.orient === 'portrait') {
			videoHero.classList.add('portrait-mode');
		} else {
			videoHero.classList.add('landscape-mode');
		}

		const mainVideo = document.getElementById('mainVideo');
		mainVideo.src = currentProject.video;
		mainVideo.addEventListener('canplay', () => {
			mainVideo.classList.add('loaded');
			mainVideo.play().catch(() => {});
		}, { once: true });

		let isPlaying = false;
		const playOverlay = document.getElementById('playOverlay');
		function togglePlay() {
			if (isPlaying) {
				mainVideo.pause();
				playOverlay.classList.remove('hidden');
				isPlaying = false;
			} else {
				mainVideo.muted = false;
				mainVideo.play().catch(() => {});
				playOverlay.classList.add('hidden');
				isPlaying = true;
			}
		}

		const prevIndex = (currentIndex - 1 + allProjects.length) % allProjects.length;
		const nextIndex = (currentIndex + 1) % allProjects.length;
		const prevProject = allProjects[prevIndex];
		const nextProject = allProjects[nextIndex];

		document.getElementById('prevBrand').textContent = prevProject.brand;
		document.getElementById('nextBrand').textContent = nextProject.brand;

		const prevParams = new URLSearchParams({
			brand: prevProject.brand, title: prevProject.title,
			desc: prevProject.desc, video: prevProject.video,
			orient: prevProject.orient, index: String(prevIndex)
		}).toString();
		const nextParams = new URLSearchParams({
			brand: nextProject.brand, title: nextProject.title,
			desc: nextProject.desc, video: nextProject.video,
			orient: nextProject.orient, index: String(nextIndex)
		}).toString();

		document.getElementById('prevLink').onclick = (e) => {
			e.preventDefault();
			smoothNavigate('video.html?' + prevParams);
		};
		document.getElementById('nextLink').onclick = (e) => {
			e.preventDefault();
			smoothNavigate('video.html?' + nextParams);
		};

		const revealObserver = new IntersectionObserver((entries) => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					entry.target.classList.add('revealed');
					revealObserver.unobserve(entry.target);
				}
			});
		}, { threshold: 0.1, rootMargin: '50px 0px' });

		document.querySelectorAll('.detail-item').forEach(item => revealObserver.observe(item));
	</script>
</body>
</html>

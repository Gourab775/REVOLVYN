<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Portfolio — REVOLVYN</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');
		*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
		html, body {
			width: 100%; min-height: 100%; background: #000;
			overflow-x: hidden; font-family: 'Inter', system-ui, sans-serif;
			color: #e8ece4; scrollbar-width: none; -ms-overflow-style: none;
		}
		html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

		/* Page transition */
		.page-transition {
			position: fixed; inset: 0; background: #000; z-index: 9999;
			pointer-events: none; opacity: 0; transition: opacity 0.4s ease;
		}
		.page-transition.active { opacity: 1; }

		/* Nav */
		.nav-float {
			position: fixed; top: 0; left: 0; right: 0;
			display: flex; justify-content: space-between; align-items: center;
			padding: 20px 40px; z-index: 100; pointer-events: none;
			background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
		}
		.nav-logo {
			font-family: 'Playfair Display', serif; font-size: 18px;
			color: rgba(245, 250, 230, 0.9); letter-spacing: 1px;
			pointer-events: auto; cursor: pointer;
		}
		.nav-links { display: flex; gap: 28px; pointer-events: auto; }
		.nav-links a {
			font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.6); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
		}
		.nav-links a:hover, .nav-links a.active { color: rgba(230, 245, 120, 0.95); }
		.nav-hamburger {
			display: none; flex-direction: column; gap: 5px;
			background: none; border: none; cursor: pointer;
			padding: 6px; pointer-events: auto; z-index: 200;
		}
		.nav-hamburger span {
			display: block; width: 22px; height: 2px;
			background: rgba(215, 230, 190, 0.8); border-radius: 2px;
			transition: all 0.3s ease;
		}
		.nav-hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
		.nav-hamburger.open span:nth-child(2) { opacity: 0; }
		.nav-hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
		.nav-mobile-overlay {
			display: none; position: fixed; inset: 0;
			background: rgba(8, 12, 5, 0.97); z-index: 99;
			flex-direction: column; align-items: center; justify-content: center;
			gap: 32px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
		}
		.nav-mobile-overlay.open { opacity: 1; pointer-events: auto; }
		.nav-mobile-overlay a {
			font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.7); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
		}
		.nav-mobile-overlay a:hover { color: rgba(230, 245, 120, 0.95); }
		@media (max-width: 768px) {
			.nav-float { padding: 16px 20px; }
			.nav-links { display: none; }
			.nav-hamburger { display: flex; }
			.nav-mobile-overlay { display: flex; }
		}

		/* Hero */
		.portfolio-hero {
			position: relative; width: 100%; height: 50vh; min-height: 360px;
			display: flex; flex-direction: column; align-items: center; justify-content: center;
			text-align: center; overflow: hidden;
		}
		.portfolio-hero::before {
			content: ''; position: absolute; inset: 0;
			background: radial-gradient(ellipse at center top, rgba(120,160,60,0.08) 0%, transparent 60%);
		}
		.portfolio-hero h1 {
			font-family: 'Playfair Display', serif; font-size: clamp(40px, 7vw, 80px);
			color: rgba(245, 250, 230, 0.92); font-weight: 400;
			letter-spacing: -1px; line-height: 1.1;
		}
		.portfolio-hero h1 em {
			font-style: italic; color: rgba(230, 245, 120, 0.85);
		}
		.portfolio-hero p {
			margin-top: 16px; font-size: 15px; color: rgba(215, 230, 190, 0.5);
			letter-spacing: 3px; text-transform: uppercase;
		}
		.hero-line {
			width: 40px; height: 1px; background: rgba(230, 245, 120, 0.4);
			margin: 24px auto 0;
		}

		/* Theme sections */
		.theme-section {
			padding: 0 40px 60px;
			max-width: 1400px; margin: 0 auto;
			opacity: 0; transform: translateY(30px);
			transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
		}
		.theme-section.revealed { opacity: 1; transform: translateY(0); }

		.theme-header {
			display: flex; align-items: center; gap: 16px;
			margin-bottom: 28px; padding-bottom: 16px;
			border-bottom: 1px solid rgba(230, 245, 120, 0.1);
		}
		.theme-header h2 {
			font-family: 'Playfair Display', serif; font-size: clamp(22px, 3vw, 32px);
			color: rgba(245, 250, 230, 0.9); font-weight: 400;
			white-space: nowrap;
		}
		.theme-header .theme-line {
			flex: 1; height: 1px;
			background: linear-gradient(to right, rgba(230, 245, 120, 0.2), transparent);
		}
		.theme-header .theme-count {
			font-size: 11px; color: rgba(215, 230, 190, 0.4);
			letter-spacing: 2px; text-transform: uppercase; white-space: nowrap;
		}

		/* Collage grid */
		.collage-grid {
			display: grid;
			grid-template-columns: repeat(12, 1fr);
			gap: 12px;
		}

		/* Collage items */
		.collage-item {
			position: relative; overflow: hidden; cursor: pointer;
			opacity: 0; transform: translateY(24px);
			background: #0a0c08; border-radius: 6px;
			transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
						transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
		}
		.collage-item.revealed { opacity: 1; transform: translateY(0); }

		/* Layout patterns - repeating 6-item cycle */
		/* Pattern A: span-6 + span-6 (two halves) */
		/* Pattern B: span-4 + span-4 + span-4 (thirds) */
		/* Pattern C: span-8 + span-4 (hero + sidebar) */
		/* Pattern D: span-4 + span-8 (sidebar + hero) */
		/* Pattern E: span-12 (full width) */

		/* Default: uniform 4-column */
		.collage-item { grid-column: span 4; aspect-ratio: 4/3; }

		/* Every 5th item pattern */
		.collage-item:nth-child(6n+1) { grid-column: span 6; aspect-ratio: 16/9; }
		.collage-item:nth-child(6n+2) { grid-column: span 6; aspect-ratio: 16/9; }
		.collage-item:nth-child(6n+3) { grid-column: span 4; aspect-ratio: 1; }
		.collage-item:nth-child(6n+4) { grid-column: span 4; aspect-ratio: 1; }
		.collage-item:nth-child(6n+5) { grid-column: span 4; aspect-ratio: 1; }
		.collage-item:nth-child(6n+6) { grid-column: span 12; aspect-ratio: 21/9; }

		/* Video element */
		.collage-item video {
			width: 100%; height: 100%; object-fit: cover;
			opacity: 0; transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease;
			filter: brightness(0.8) saturate(0.9);
		}
		.collage-item video.loaded { opacity: 1; }
		.collage-item:hover video {
			transform: scale(1.04);
			filter: brightness(1) saturate(1.1);
		}

		/* Overlay */
		.collage-overlay {
			position: absolute; inset: 0;
			background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.1) 35%, transparent 50%);
			display: flex; flex-direction: column; justify-content: flex-end;
			padding: 24px; opacity: 0;
			transition: opacity 0.35s ease;
		}
		.collage-item:hover .collage-overlay { opacity: 1; }
		.collage-overlay .brand-tag {
			display: inline-block; align-self: flex-start;
			padding: 4px 10px; margin-bottom: 10px;
			background: rgba(230, 245, 120, 0.12); border: 1px solid rgba(230, 245, 120, 0.2);
			border-radius: 20px;
			font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(230, 245, 120, 0.9); font-weight: 500;
		}
		.collage-overlay h3 {
			font-family: 'Playfair Display', serif; font-size: clamp(16px, 2vw, 24px);
			color: rgba(248, 252, 240, 0.95); margin-bottom: 4px; line-height: 1.2;
		}
		.collage-overlay .desc {
			font-size: 12px; color: rgba(215, 230, 190, 0.55);
			line-height: 1.5; max-width: 400px;
			display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
		}
		.collage-overlay .view-btn {
			margin-top: 14px; display: inline-flex; align-items: center; gap: 6px;
			font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(230, 245, 120, 0.9); font-weight: 500;
		}
		.collage-overlay .view-btn::after {
			content: '\2192'; transition: transform 0.3s;
		}
		.collage-item:hover .view-btn::after { transform: translateX(4px); }

		/* CTA */
		.portfolio-cta {
			text-align: center; padding: 40px 20px 100px;
		}
		.portfolio-cta a {
			display: inline-block; padding: 14px 40px;
			border: 1px solid rgba(180, 220, 100, 0.25); border-radius: 40px;
			color: rgba(200, 230, 130, 0.8); font-size: 11px;
			letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
			transition: all 0.3s; font-weight: 500;
			background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
		}
		.portfolio-cta a:hover {
			background: rgba(180, 220, 100, 0.1);
			border-color: rgba(180, 220, 100, 0.5);
			color: rgba(230, 245, 120, 0.95);
		}

		/* Mobile */
		@media (max-width: 768px) {
			.portfolio-hero { height: 35vh; min-height: 240px; }
			.theme-section { padding: 0 16px 48px; }
			.theme-header { margin-bottom: 20px; padding-bottom: 12px; }
			.collage-grid {
				grid-template-columns: repeat(2, 1fr);
				gap: 8px;
			}
			.collage-item { grid-column: span 1 !important; aspect-ratio: 1/1 !important; }
			.collage-item:nth-child(4n+1) {
				grid-column: span 2 !important;
				aspect-ratio: 16/9 !important;
			}
			.collage-overlay { padding: 14px; }
			.collage-overlay .desc { display: none; }
		}
	</style>
</head>

			{ id: "lifestyle", name: "Lifestyle & Performance", filter: "lifestyle" },
			{ id: "food", name: "Food & Hospitality", filter: "food" },
			{ id: "entertainment", name: "Entertainment & Culture", filter: t => ["entertainment","education","finance"].includes(t) }
		];

		const container = document.getElementById('themeContainer');
		let globalIndex = 0;

		mergedThemes.forEach(theme => {
			const filtered = projects.filter(p => {
				if (typeof theme.filter === 'function') return theme.filter(p.theme);
				return p.theme === theme.filter;
			});
			if (filtered.length === 0) return;

			const section = document.createElement('div');
			section.className = 'theme-section';
			section.setAttribute('data-reveal-section', '');

			const grid = document.createElement('div');
			grid.className = 'collage-grid';

			filtered.forEach((project) => {
				const item = document.createElement('div');
				item.className = 'collage-item';
				item.setAttribute('data-reveal', '');
				item.setAttribute('data-delay', String(Math.min(globalIndex % 12, 8)));

				const params = new URLSearchParams({
					brand: project.brand,
					title: project.title,
					desc: project.desc,
					video: project.video,
					index: String(globalIndex)
				}).toString();

				item.onclick = () => smoothNavigate('video.html?' + params);

				const preload = globalIndex < 4 ? 'auto' : 'none';
				const srcAttr = globalIndex < 4 ? `src="${project.video}"` : '';
				const dataSrcAttr = globalIndex >= 4 ? `data-src="${project.video}"` : '';

				item.innerHTML = `
					<video muted loop playsinline preload="${preload}" ${srcAttr} ${dataSrcAttr}></video>
					<div class="collage-overlay">
						<div class="brand-tag">${project.brand}</div>
						<h3>${project.title}</h3>
						<div class="desc">${project.desc}</div>
						<div class="view-btn">View Project</div>
					</div>
				`;
				grid.appendChild(item);
				globalIndex++;
			});

			section.innerHTML = `
				<div class="theme-header">
					<h2>${theme.name}</h2>
					<div class="theme-line"></div>
					<div class="theme-count">${filtered.length} Projects</div>
				</div>
			`;
			section.appendChild(grid);
			container.appendChild(section);
		});

		// Mark preloaded videos as loaded
		document.querySelectorAll('.collage-item:nth-child(-n+4) video').forEach(v => {
			if (v.readyState >= 2) v.classList.add('loaded');
			else v.addEventListener('canplay', () => v.classList.add('loaded'), { once: true });
		});

		// Lazy load videos
		const videoObserver = new IntersectionObserver((entries) => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					const video = entry.target;
					if (!video.src && video.dataset.src) {
						video.src = video.dataset.src;
						video.addEventListener('loadeddata', () => {
							video.classList.add('loaded');
							video.play().catch(() => {});
						}, { once: true });
						setTimeout(() => { video.classList.add('loaded'); }, 2000);
					}
					videoObserver.unobserve(video);
				}
			});
		}, { rootMargin: '600px 0px', threshold: 0.01 });

		// Reveal sections
		const sectionObserver = new IntersectionObserver((entries) => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					entry.target.classList.add('revealed');
					sectionObserver.unobserve(entry.target);
				}
			});
		}, { threshold: 0.05, rootMargin: '80px 0px' });

		// Reveal items
		const revealObserver = new IntersectionObserver((entries) => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					const delay = (entry.target.dataset.delay || 0) * 80;
					setTimeout(() => {
						entry.target.classList.add('revealed');
					}, delay);
					revealObserver.unobserve(entry.target);
				}
			});
		}, { threshold: 0.05, rootMargin: '50px 0px' });

		document.querySelectorAll('.theme-section').forEach(s => sectionObserver.observe(s));
		document.querySelectorAll('.collage-item').forEach(item => {
			revealObserver.observe(item);
			const video = item.querySelector('video');
			if (video) videoObserver.observe(video);
		});

		// Pause videos not in viewport
		const pauseObserver = new IntersectionObserver((entries) => {
			entries.forEach(entry => {
				const video = entry.target.querySelector('video');
				if (!video) return;
				if (entry.isIntersecting) {
					video.play().catch(() => {});
				} else {
					video.pause();
				}
			});
		}, { threshold: 0 });
		document.querySelectorAll('.collage-item').forEach(item => pauseObserver.observe(item));
	</script>
</body>
</html>

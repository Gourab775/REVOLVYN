		*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
		html, body {
			width: 100%; min-height: 100%; background: #000;
			overflow-x: hidden; font-family: 'Inter', system-ui, sans-serif;

		html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

		/* Page transition */
		.page-transition {
			position: fixed; inset: 0; background: #000; z-index: 9999;
			pointer-events: none; opacity: 0; transition: opacity 0.4s ease;
		}
		.page-transition.active { opacity: 1; }

		/* Nav */
		.nav-float {
			position: fixed; top: 0; left: 0; right: 0;
			display: flex; justify-content: space-between; align-items: center;
			padding: 20px 40px; z-index: 100; pointer-events: none;
			background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
		}
		.nav-logo {
			font-family: 'Playfair Display', serif; font-size: 18px;
			color: rgba(245, 250, 230, 0.9); letter-spacing: 1px;
			pointer-events: auto; cursor: pointer;
		}
		.nav-links { display: flex; gap: 28px; pointer-events: auto; }
		.nav-links a {
			font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.6); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
		}
		.nav-links a:hover, .nav-links a.active { color: rgba(230, 245, 120, 0.95); }
		.nav-hamburger {
			display: none; flex-direction: column; gap: 5px;
			background: none; border: none; cursor: pointer;
			padding: 6px; pointer-events: auto; z-index: 200;
		}
		.nav-hamburger span {
			display: block; width: 22px; height: 2px;
			background: rgba(215, 230, 190, 0.8); border-radius: 2px;
			transition: all 0.3s ease;
		}
		.nav-hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
		.nav-hamburger.open span:nth-child(2) { opacity: 0; }
		.nav-hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
		.nav-mobile-overlay {
			display: none; position: fixed; inset: 0;
			background: rgba(8, 12, 5, 0.97); z-index: 99;
			flex-direction: column; align-items: center; justify-content: center;
			gap: 32px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
		}
		.nav-mobile-overlay.open { opacity: 1; pointer-events: auto; }
		.nav-mobile-overlay a {
			font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
			color: rgba(215, 230, 190, 0.7); text-decoration: none;
			transition: color 0.3s; font-weight: 500;
		}
		.nav-mobile-overlay a:hover { color: rgba(230, 245, 120, 0.95); }
		@media (max-width: 768px) {
			.nav-float { padding: 16px 20px; }
			.nav-links { display: none; }
			.nav-hamburger { display: flex; }
			.nav-mobile-overlay { display: flex; }
		}

		/* Hero */
		.portfolio-hero {
			position: relative; width: 100%; height: 50vh; min-height: 360px;
			display: flex; flex-direction: column; align-items: center; justify-content: center;
			text-align: center; overflow: hidden;
		}
		.portfolio-hero::before {
			content: ''; position: absolute; inset: 0;
			background: radial-gradient(ellipse at center top, rgba(120,160,60,0.08) 0%, transparent 60%);
		}
		.portfolio-hero h1 {
			font-family: 'Playfair Display', serif; font-size: clamp(40px, 7vw, 80px);
			color: rgba(245, 250, 230, 0.92); font-weight: 400;
			letter-spacing: -1px; line-height: 1.1;
		}
		.portfolio-hero h1 em {
			font-style: italic; color: rgba(230, 245, 120, 0.85);
		}
		.portfolio-hero p {
			margin-top: 16px; font-size: 15px; color: rgba(215, 230, 190, 0.5);
			letter-spacing: 3px; text-transform: uppercase;
		}
		.hero-line {
			width: 40px; height: 1px; background: rgba(230, 245, 120, 0.4);
			margin: 24px auto 0;
		}

		/* Collage section */
		.collage-section {
			padding: 0 16px 80px;
		}
		.collage {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 4px;
			max-width: 1200px; margin: 0 auto;
		}

		/* Items */
		.collage-item {
			position: relative; overflow: hidden; cursor: pointer;
			opacity: 0; transform: translateY(20px);
			background: #0a0c08;
			transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
						transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
		}
		.collage-item.revealed { opacity: 1; transform: translateY(0); }

		/* Row 1: hero wide + two squares */
		.collage-item:nth-child(1) { grid-column: span 2; aspect-ratio: 2/1; }
		.collage-item:nth-child(2) { aspect-ratio: 1; }
		.collage-item:nth-child(3) { aspect-ratio: 1; }
		/* Row 2: two portrait + one wide */
		.collage-item:nth-child(4) { aspect-ratio: 3/4; }
		.collage-item:nth-child(5) { grid-column: span 2; aspect-ratio: 16/9; }
		/* Row 3: repeat pattern */
		.collage-item:nth-child(6) { grid-column: span 2; aspect-ratio: 16/9; }
		.collage-item:nth-child(7) { aspect-ratio: 1; }
		.collage-item:nth-child(8) { aspect-ratio: 3/4; }
		/* Row 4 */
		.collage-item:nth-child(9) { aspect-ratio: 1; }
		.collage-item:nth-child(10) { grid-column: span 2; aspect-ratio: 2/1; }
		/* Row 5 */
		.collage-item:nth-child(11) { grid-column: span 2; aspect-ratio: 16/9; }
		.collage-item:nth-child(12) { aspect-ratio: 1; }
		/* Row 6 */
		.collage-item:nth-child(13) { aspect-ratio: 3/4; }
		.collage-item:nth-child(14) { grid-column: span 2; aspect-ratio: 2/1; }
		/* Default for rest: uniform 3-col */
		.collage-item:nth-child(n+15) { aspect-ratio: 4/3; }
		.collage-item:nth-child(3n+16) { grid-column: span 1; aspect-ratio: 3/4; }
		.collage-item:nth-child(5n+17) { grid-column: span 2; aspect-ratio: 16/9; }

		.collage-item video {
			width: 100%; height: 100%; object-fit: cover;
			opacity: 0; transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease;
			filter: brightness(0.85) saturate(0.9);
		}
		.collage-item video.loaded { opacity: 1; }
		.collage-item:hover video {
			transform: scale(1.05);
			filter: brightness(1) saturate(1.1);
		}

		/* Overlay */
		.collage-overlay {
			position: absolute; inset: 0;
			background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 40%);
			display: flex; flex-direction: column; justify-content: flex-end;
			padding: 20px; opacity: 0;
			transition: opacity 0.35s ease;
		}
		.collage-item:hover .collage-overlay { opacity: 1; }
		.collage-overlay h3 {
			font-family: 'Playfair Display', serif; font-size: clamp(13px, 1.4vw, 18px);
			color: rgba(248, 252, 240, 0.95); margin-bottom: 3px;
		}
		.collage-overlay span {
			font-size: 9px; color: rgba(215, 230, 190, 0.5);
			letter-spacing: 2px; text-transform: uppercase;
		}
		.collage-overlay .view-btn {
			margin-top: 10px; display: inline-flex; align-items: center; gap: 6px;
			font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
			color: rgba(230, 245, 120, 0.9); font-weight: 500;
		}
		.collage-overlay .view-btn::after {
			content: '\2192'; transition: transform 0.3s;
		}
		.collage-item:hover .view-btn::after { transform: translateX(4px); }

		/* CTA */
		.portfolio-cta {
			text-align: center; padding: 40px 20px 100px;
		}
		.portfolio-cta a {
			display: inline-block; padding: 14px 40px;
			border: 1px solid rgba(180, 220, 100, 0.25); border-radius: 40px;
			color: rgba(200, 230, 130, 0.8); font-size: 11px;
			letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
			transition: all 0.3s; font-weight: 500;
			background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
		}
		.portfolio-cta a:hover {
			background: rgba(180, 220, 100, 0.1);
			border-color: rgba(180, 220, 100, 0.5);
			color: rgba(230, 245, 120, 0.95);
		}

		/* Mobile */
		@media (max-width: 768px) {
			.portfolio-hero { height: 35vh; min-height: 240px; }
			.collage-section { padding: 0 8px 60px; }
			.collage {
				grid-template-columns: repeat(2, 1fr);
				gap: 3px;
			}
			.collage-item:nth-child(n) {
				grid-column: span 1 !important;
				aspect-ratio: 1/1 !important;
			}
			.collage-item:nth-child(1),
			.collage-item:nth-child(5),
			.collage-item:nth-child(9),
			.collage-item:nth-child(13),
			.collage-item:nth-child(17),
			.collage-item:nth-child(21),
			.collage-item:nth-child(25),
			.collage-item:nth-child(29),
			.collage-item:nth-child(33),
			.collage-item:nth-child(37),
			.collage-item:nth-child(41),
			.collage-item:nth-child(45) {
				grid-column: span 2 !important;
				aspect-ratio: 16/9 !important;
			}
			.collage-overlay { padding: 12px; }
		}
	</style>
</head>

		});

		// Mark preloaded videos as loaded immediately
		document.querySelectorAll('.collage-item:nth-child(-n+6) video').forEach(v => {
			if (v.readyState >= 2) v.classList.add('loaded');
			else v.addEventListener('canplay', () => v.classList.add('loaded'), { once: true });
		});

		// Lazy load videos with IntersectionObserver
		const videoObserver = new IntersectionObserver((entries) => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					const video = entry.target;
					if (!video.src && video.dataset.src) {
						video.src = video.dataset.src;
						video.addEventListener('loadeddata', () => {
							video.classList.add('loaded');
							video.play().catch(() => {});
						}, { once: true });
						setTimeout(() => { video.classList.add('loaded'); }, 1500);
					}
					videoObserver.unobserve(video);
				}
			});
		}, { rootMargin: '400px 0px', threshold: 0.01 });

		// Reveal items on scroll
		const revealObserver = new IntersectionObserver((entries) => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					const delay = (entry.target.dataset.delay || 0) * 80;
					setTimeout(() => {
						entry.target.classList.add('revealed');
					}, delay);
					revealObserver.unobserve(entry.target);
				}
			});
		}, { threshold: 0.05, rootMargin: '50px 0px' });

		document.querySelectorAll('.collage-item').forEach(item => {
			revealObserver.observe(item);
			const video = item.querySelector('video');
			if (video) videoObserver.observe(video);
		});

		// Pause videos not in viewport for performance
		const pauseObserver = new IntersectionObserver((entries) => {
			entries.forEach(entry => {
				const video = entry.target.querySelector('video');
				if (!video) return;
				if (entry.isIntersecting) {
					video.play().catch(() => {});
				} else {
					video.pause();
				}
			});
		}, { threshold: 0 });
		document.querySelectorAll('.collage-item').forEach(item => pauseObserver.observe(item));
	</script>
</body>
</html>
